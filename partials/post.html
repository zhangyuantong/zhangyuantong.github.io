<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.className += ' js';</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — Victor Zhang</title>
<meta name="description" content="{{excerpt}}">
<meta name="post:tags" content="{{tags_attr}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0c'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='%23d6ac63' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
{{katex_head}}
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<!-- AURORA:START -->
<!-- AURORA:END -->
<div class="grain" aria-hidden="true"></div>
<div class="spotlight" aria-hidden="true"></div>
<div class="reading-progress" aria-hidden="true"></div>

<div class="shell">

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><i></i><span>Victor Zhang</span></a>
      <!-- NAV:START -->
      <!-- NAV:END -->
    </div>
  </header>

  <main>

    <section class="article-head wrap">
      <p class="article-meta">
        <time datetime="{{date_iso}}">{{date_text}}</time>
        <span>{{reading}} min read</span>
        <span>{{tags_line}}</span>
      </p>
      <h1>{{title}}</h1>
    </section>

    <article class="article-body wrap">
      <!-- BODY:START -->
      <!-- BODY:END -->
      <p><a href="/posts/">← All posts</a></p>
    </article>

  </main>

  <footer class="site-footer">
    <!-- FOOTER:START -->
    <!-- FOOTER:END -->
  </footer>

</div>

{{katex_scripts}}
<script src="/assets/main.js"></script>
</body>
</html>
